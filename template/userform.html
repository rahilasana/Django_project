{% extends 'base.html' %} {% load static %} {% block title %} About | Little
Stars {% endblock %} {% block css %}
<link rel="stylesheet" href="{% static 'css/userform.css' %}" />
{% endblock %} {% block content %}
<section class="user-form-section">
  {% comment %} <form class="user-form" method="GET"> {% endcomment %}
     <form class="user-form" method="POST">
        {% csrf_token %}
    <h2>User Form</h2>

    {% comment %}
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
      />
    </div>

    <div class="form-group">
      <label for="phone">Phone</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
      />
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <textarea
        id="address"
        name="address"
        placeholder="Enter your address"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="city">City</label>
      <select id="city" name="city">
        <option value="">Select your city</option>
        <option value="lahore">Lahore</option>
        <option value="karachi">Karachi</option>
        <option value="islamabad">Islamabad</option>
        <option value="multan">Multan</option>
      </select>
    </div>
    {% endcomment %}

    <div class="form-group">
      <label for="password">value1</label>
      <input type="int" name="val1" placeholder="Enter your a number" />
    </div>
    <div class="form-group">
      <label for="password">value2</label>
      <input type="int" name="val2" placeholder="Enter your a number" />
    </div>
    <div class="form-group">
      <label for="password">result</label>
      <input type="int" value="{{output}}" />
    </div>

    <button type="submit">Submit</button>
  </form>
</section>

{% endblock %}
