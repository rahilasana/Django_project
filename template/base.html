{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Little Stars{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    {% block css %}{% endblock %}
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            Little<span>Stars</span>
        </div>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="{% url 'products' %}">Products</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
            <li><a href="{% url 'contact' %}">Contact</a></li>
        </ul>
    </nav>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer>
        <p>© 2026 Little Stars Kids Clothing</p>
    </footer>

</body>
</html>
