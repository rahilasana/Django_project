{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Little Stars{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />

    {% block css %}{% endblock %}
  </head>
  <style type="text/tailwindcss">
    @theme {
      --color-clifford: #da373d;
    }
    .nav-links .active a {
      background-color: blue;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
    }
    head{
      

    }
  </style>

  <body class="">
    <head>
      <nav class="navbar">
        <div class="logo">Little<span>Stars</span></div>
        <ul class="nav-links">
          <li class="{% if request.path == '/' %}active{% endif %}">
            <a href="/">Home</a>
          </li>

          <li class="{% if request.path == '/products/' %}active{% endif %}">
            <a href="{% url 'products' %}">Products</a>
          </li>

          <li class="{% if request.path == '/about/' %}active{% endif %}">
            <a href="{% url 'about' %}">About</a>
          </li>
          <li class="{% if request.path == '/categories/' %}active{% endif %}">
            <a href="{% url 'categories' %}">Categories</a>
          </li>
          <li class="{% if request.path == '/contact/' %}active{% endif %}">
            <a href="{% url 'contact' %}">Contact</a>
          </li>
        </ul>
      </nav>
    </head>

    <main>{% block content %} {% endblock %}</main>

    <footer>
      <p>© 2026 Little Stars Kids Clothing</p>
    </footer>
  </body>
</html>
